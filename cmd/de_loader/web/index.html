<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>de_loader</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><h1>de_loader</h1><small>Загрузчик аудио</small></div><button class="ghost" onclick="showSettings()">Настройки</button></header><section class="hero"><label>Ссылка на видео, Short или плейлист YouTube</label><div class="row"><input id="url" type="url" placeholder="Вставьте ссылку сюда" required><button id="load" onclick="preview()" disabled>Загрузить</button></div><p id="linkHint" class="hint">Вставьте ссылку формата youtube.com или youtu.be</p><p id="loading" class="hint hidden">Загружаем информацию…</p><div id="preview" class="preview hidden"><img id="thumbnail" alt="Превью"><div><b id="title"></b><p id="details"></p><label id="playlistLabel" class="hidden"><input id="playlist" type="checkbox"> Скачать весь плейлист</label></div></div><div class="save">Сохранить в <b id="folder"></b><button class="ghost" onclick="chooseFolder()">Выбрать папку</button></div><div id="actions" class="actions hidden"><button class="primary" onclick="download('now')">Скачать сразу</button><button class="ghost" onclick="download('queue')">Добавить в очередь</button></div></section><section id="job" class="card hidden"><div class="jobtop"><b id="stage"></b><span id="jobTimer" class="hint"></span></div><progress id="progress" max="100"></progress><p id="error"></p><p id="output"></p><button id="openFolder" class="hidden" onclick="openFolder()">Открыть папку</button><button id="cancel" class="ghost" onclick="cancelJob()">Отменить</button></section><section id="components" class="card hidden"><b>Нужны компоненты загрузки</b><p id="componentStatus"></p><button onclick="install()">Повторить</button></section><section id="settings" class="card hidden"><h2>Настройки</h2><p>Файлы: <b id="settingsFolder"></b></p><button onclick="chooseFolder()">Выбрать папку</button></section><section id="updateBanner" class="update hidden"><b>Доступно обновление</b><span id="updateText"></span></section><section id="diagnostics" class="card hidden"><h2>Журнал диагностики</h2><button class="ghost" onclick="copyLog()">Скопировать журнал</button><pre id="logText"></pre></section></main><script src="/app.js"></script></body></html>
